:root {
  --ink: #241d33;
  --panel: rgba(36, 28, 52, 0.78);
  --panel-solid: #2a2140;
  --paper: #fff7ee;
  --muted: #cbbfd9;
  --gold: #ffc85a;
  --rose: #ff8fab;
  --sky: #7cc8ff;
  --mint: #84e2b6;
  --danger: #ff7a6b;
  --radius: 18px;
  --display: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: #151020; overflow: hidden; font-family: var(--body); color: var(--paper); }
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui { font-family: var(--body); }
.hud-layer { position: absolute; inset: 0; overflow: hidden; }
.hud-chip { position: absolute; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; border-radius: 16px; background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(20, 12, 30, 0.25); }
.hud-place { top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; max-width: min(360px, calc(100vw - 32px)); }
.hud-time-icon { width: 30px; height: 30px; flex: none; }
.hud-time-icon svg { width: 100%; height: 100%; }
.hud-place-name { font-family: var(--display); font-weight: 700; font-size: 15px; line-height: 1.1; letter-spacing: 0.01em; }
.hud-clock { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
.hud-companions { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; display: flex; gap: 8px; }
.companion { display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--display); font-weight: 600; font-size: 12px; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
.companion-face { width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff8 0 12%, transparent 13%), var(--c1); border: 3px solid var(--paper); box-shadow: 0 4px 12px rgba(0,0,0,.25); }
.hotbar-wrap { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: calc(100vw - 32px); }
.hotbar-label { font-family: var(--display); font-weight: 700; font-size: 15px; padding: 3px 14px; border-radius: 999px; background: var(--panel); letter-spacing: 0.02em; }
.hotbar { display: flex; gap: 6px; padding: 7px; border-radius: 20px; background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 8px 30px rgba(20, 12, 30, 0.3); pointer-events: auto; overflow-x: auto; }
.slot { position: relative; width: 54px; height: 54px; flex: none; border: 0; border-radius: 14px; background: rgba(255, 247, 238, 0.07); padding: 7px; cursor: pointer; transition: transform 0.15s ease, background 0.15s ease; }
.slot svg { width: 100%; height: 100%; display: block; }
.slot:hover { background: rgba(255, 247, 238, 0.14); }
.slot:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.slot.selected { background: rgba(255, 200, 90, 0.22); box-shadow: inset 0 0 0 2px var(--gold); transform: translateY(-3px); }
.slot.empty svg { opacity: 0.35; filter: grayscale(0.8); }
.slot-key { position: absolute; top: 3px; left: 6px; font-family: var(--display); font-size: 11px; font-weight: 700; color: var(--muted); }
.slot-count { position: absolute; bottom: 2px; right: 6px; font-family: var(--display); font-weight: 800; font-size: 14px; color: var(--paper); text-shadow: 0 1px 2px rgba(0,0,0,.6); font-variant-numeric: tabular-nums; }
.prompts { position: absolute; left: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 5px; }
.prompt { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,.55); }
.prompt kbd { min-width: 22px; text-align: center; padding: 2px 7px; border-radius: 8px; background: var(--panel); font-family: var(--display); font-size: 12px; font-weight: 700; color: var(--gold); box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
.crosshair { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255, 247, 238, 0.85); box-shadow: 0 0 0 2px rgba(36, 28, 52, 0.35); }
.toasts { position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; width: min(520px, calc(100vw - 32px)); }
.toast { padding: 9px 16px; border-radius: 14px; background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-weight: 700; font-size: 14px; text-align: center; opacity: 0; transform: translateY(-8px); transition: opacity 0.3s ease, transform 0.3s ease; box-shadow: 0 6px 20px rgba(20,12,30,.25); }
.toast.show { opacity: 1; transform: none; }
.toast-love { box-shadow: inset 0 0 0 2px var(--rose); }
.toast-danger { box-shadow: inset 0 0 0 2px var(--danger); }
.toast-warn { box-shadow: inset 0 0 0 2px var(--gold); }
.toast-meh { color: var(--muted); }
.marker { position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; }
.emote { position: absolute; left: -22px; top: -62px; width: 44px; height: 44px; padding: 7px; border-radius: 50%; background: var(--paper); box-shadow: 0 4px 12px rgba(20,12,30,.3); opacity: 0; transform: scale(0.4); transition: opacity 0.2s ease, transform 0.25s cubic-bezier(.34,1.56,.64,1); }
.emote::after { content: ''; position: absolute; left: 50%; bottom: -5px; width: 12px; height: 12px; margin-left: -6px; background: var(--paper); transform: rotate(45deg); border-radius: 2px; }
.emote svg { width: 100%; height: 100%; display: block; position: relative; z-index: 1; }
.emote.on { opacity: 1; transform: scale(1); }
.emote.pop { animation: pop 0.45s cubic-bezier(.34,1.56,.64,1); }
@keyframes pop { 0% { transform: scale(0.3); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.trust { position: absolute; left: -17px; top: -16px; width: 34px; height: 34px; opacity: 0; transition: opacity 0.3s ease; }
.trust.on { opacity: 1; }
.trust svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.trust-bg { fill: rgba(36,28,52,.55); stroke: rgba(255,247,238,.25); stroke-width: 4; }
.trust-fg { fill: none; stroke: var(--mint); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 0 100; transition: stroke-dasharray 0.3s ease; }
.trust-paw { position: absolute; inset: 9px; color: var(--mint); }
.trust-paw svg { transform: none; }
.cat-info { position: absolute; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100vw - 32px)); padding: 14px 16px; border-radius: 18px; background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 8px 30px rgba(20,12,30,.3); display: flex; flex-direction: column; gap: 7px; }
.ci-head { display: flex; align-items: center; justify-content: space-between; }
.ci-name { font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1; }
.ci-sex { width: 22px; height: 22px; }
.ci-sex.f { color: var(--rose); }
.ci-sex.m { color: var(--sky); }
.ci-coat { font-size: 13px; color: var(--muted); font-weight: 600; }
.ci-temper { font-size: 13px; line-height: 1.35; }
.ci-temper b { color: var(--gold); font-family: var(--display); font-weight: 700; }
.ci-trust { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.ci-trust .bar { flex: 1; height: 8px; border-radius: 99px; background: rgba(255,247,238,.12); overflow: hidden; }
.ci-trust .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--mint), #b7f5d6); border-radius: 99px; transition: width .3s ease; }
.ci-likes { display: flex; flex-wrap: wrap; gap: 5px; font-size: 12px; font-weight: 700; }
.ci-likes.muted { color: var(--muted); font-weight: 600; }
.like { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 3px; border-radius: 99px; background: rgba(255,247,238,.08); }
.like svg { width: 20px; height: 20px; }
.like-love { box-shadow: inset 0 0 0 1.5px var(--rose); }
.like-like { box-shadow: inset 0 0 0 1.5px var(--mint); }
.like-no { opacity: .7; }
@media (max-width: 720px) {
  .prompts { display: none; }
  .slot { width: 46px; height: 46px; }
  .cat-info { bottom: auto; top: 76px; }
}
@media (prefers-reduced-motion: reduce) {
  .emote, .toast, .slot { transition: none; }
  .emote.pop { animation: none; }
}
.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(18, 12, 28, 0.35); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); pointer-events: auto; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.panel { background: var(--panel-solid); border-radius: 24px; box-shadow: 0 24px 80px rgba(10, 6, 18, 0.55), inset 0 1px 0 rgba(255,255,255,.06); color: var(--paper); max-height: calc(100vh - 32px); overflow: auto; }
.btn { font-family: var(--display); font-weight: 700; font-size: 15px; border: 0; border-radius: 14px; padding: 10px 18px; background: rgba(255,247,238,.1); color: var(--paper); cursor: pointer; transition: transform .15s ease, background .15s ease, opacity .15s ease; }
.btn:hover:not([disabled]) { background: rgba(255,247,238,.18); transform: translateY(-1px); }
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn.primary { background: var(--gold); color: #3a2410; box-shadow: 0 6px 18px rgba(255,200,90,.3); }
.btn.primary:hover:not([disabled]) { background: #ffd57a; }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(255,247,238,.2); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn kbd { font-family: var(--display); font-size: 11px; margin-left: 6px; padding: 1px 6px; border-radius: 6px; background: rgba(0,0,0,.2); }
.muted { color: var(--muted); }
.sexi { display: inline-block; width: 18px; height: 18px; flex: none; }
.sexi svg { width: 100%; height: 100%; }
.sexi.f { color: var(--rose); }
.sexi.m { color: var(--sky); }
.chip { display: inline-block; margin: 0 5px 5px 0; padding: 3px 9px; border-radius: 99px; background: rgba(255,247,238,.08); font-size: 12px; font-weight: 700; }
.badge { display: inline-block; margin: 6px 4px 0 0; padding: 2px 8px; border-radius: 99px; background: var(--rose); color: #3a1020; font-family: var(--display); font-weight: 700; font-size: 12px; }
.capture-card { position: relative; width: min(380px, 100%); padding: 26px 24px 22px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; animation: cardIn .5s cubic-bezier(.34,1.56,.64,1); }
@keyframes cardIn { from { transform: translateY(30px) scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
.cap-burst { position: absolute; top: -26px; width: 52px; height: 52px; padding: 11px; border-radius: 50%; background: var(--gold); color: #3a2410; box-shadow: 0 8px 24px rgba(255,200,90,.45); }
.cap-kicker { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: .01em; color: var(--gold); text-wrap: balance; margin-top: 12px; }
.cap-portrait { width: 240px; max-width: 100%; aspect-ratio: 1; border-radius: 22px; background: radial-gradient(circle at 50% 40%, #4a3c63, #2a2140); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.cap-name-label { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.cap-name, .gd-name { font-family: var(--display); font-weight: 800; font-size: 26px; text-align: center; width: 100%; max-width: 280px; padding: 4px 10px; border-radius: 12px; border: 0; background: rgba(255,247,238,.07); color: var(--paper); }
.cap-name:focus, .gd-name:focus { outline: 2px solid var(--gold); background: rgba(255,247,238,.12); }
.cap-meta { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--muted); }
.cap-temper { font-size: 14px; line-height: 1.4; max-width: 30ch; }
.cap-temper b { color: var(--gold); font-family: var(--display); }
.cap-note { font-size: 12px; color: var(--muted); }
.capture-card .btn { margin-top: 10px; min-width: 160px; }
.gatil { width: min(1040px, 100%); padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
.gatil-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.gatil-head h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; }
.gatil-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; font-weight: 700; }
.gatil-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 30px 10px 40px; }
.gatil-empty h3 { margin: 0; font-family: var(--display); font-size: 22px; }
.gatil-empty p { margin: 0; max-width: 52ch; line-height: 1.5; color: var(--muted); }
.empty-art { width: 64px; height: 64px; color: var(--gold); opacity: .8; }
.gatil-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px; min-height: 0; }
.gatil-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; align-content: start; max-height: 470px; overflow: auto; padding: 2px; }
.gcard { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 6px 10px; border: 0; border-radius: 16px; background: rgba(255,247,238,.06); color: var(--paper); cursor: pointer; transition: background .15s ease, transform .15s ease; font: inherit; }
.gcard:hover { background: rgba(255,247,238,.11); transform: translateY(-2px); }
.gcard.active { box-shadow: inset 0 0 0 2px var(--gold); background: rgba(255,200,90,.1); }
.gcard img { width: 100%; aspect-ratio: 1; border-radius: 12px; background: #3a2e52; }
.gcard-name { display: flex; align-items: center; gap: 5px; font-family: var(--display); font-weight: 700; font-size: 15px; max-width: 100%; }
.gcard-name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gcard-sub { font-size: 11.5px; color: var(--muted); font-weight: 700; text-align: center; line-height: 1.25; }
.gdetail { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; align-content: start; }
.gd-portrait { width: 200px; aspect-ratio: 1; border-radius: 20px; background: radial-gradient(circle at 50% 40%, #4a3c63, #2a2140); }
.gd-info { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.gd-title { display: flex; align-items: center; gap: 8px; }

.gd-coat { color: var(--muted); font-weight: 700; font-size: 14px; }

.gd-k { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }

    document.body.appendChild(bar);
    if (ios) show('No iPhone: toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.', false);
    const tick = setInterval(() => {
      const g = window.RONROM && window.RONROM.game;
      if (g && g.mode === 'play') {
        bar.hidden = true;
        clearInterval(tick);
      }
    }, 800);
  });
})();

</script>
</body>
