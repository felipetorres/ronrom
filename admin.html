:root { --bg: #151020; --panel: rgba(36,28,52,.92); --line: rgba(255,247,238,.1); --paper: #fff7ee; --muted: #c9bcd6; --gold: #ffc85a; --rose: #ff9fb8; --bad: #ff8a8a; --display: 'Baloo 2', Nunito, system-ui, sans-serif; --body: Nunito, system-ui, sans-serif; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--paper); font: 600 15px/1.45 var(--body); }
#app { max-width: 980px; margin: 0 auto; padding: 20px 16px 110px; }
h1, h2 { font-family: var(--display); font-weight: 800; margin: 0; }
h1 { font-size: 28px; }
h2 { font-size: 19px; }
a { color: var(--gold); }
.adm-msg { max-width: 560px; margin: 12vh auto 0; padding: 26px; border-radius: 22px; background: var(--panel); }
.adm-msg h2 { margin: 14px 0 6px; }
.adm-msg p { margin: 0; color: var(--muted); }
.adm-actions { display: flex; gap: 10px; margin-top: 18px; }
.adm-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.adm-head p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; max-width: 60ch; }
.adm-link { flex: none; padding: 9px 14px; border-radius: 12px; background: rgba(255,247,238,.08); text-decoration: none; font-family: var(--display); font-weight: 700; }
.adm-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; }
.adm-group { padding: 16px 16px 8px; border-radius: 20px; background: var(--panel); }
.adm-group h2 { margin-bottom: 8px; }
.adm-hint { margin: -2px 0 8px; color: var(--muted); font-size: 12.5px; }
.adm-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.adm-row label { flex: 1; min-width: 0; font-size: 14px; }
.adm-row label small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 700; }
.adm-in { flex: none; display: flex; align-items: center; gap: 8px; }
.adm-in input { width: 116px; padding: 7px 10px; border: 2px solid transparent; border-radius: 10px; background: rgba(255,247,238,.08); color: var(--paper); font: 700 15px var(--body); text-align: right; }
.adm-in input[type=text] { width: 168px; text-align: left; }
.adm-in input:focus { outline: none; border-color: var(--gold); }
.adm-note { min-width: 64px; color: var(--muted); font-size: 12px; text-align: right; }
.adm-row.custom label small::after { content: ' · mudado'; color: var(--gold); }
.adm-in input.dirty { border-color: rgba(255,200,90,.6); }
.adm-in input.bad { border-color: var(--bad); }
.adm-in input.adm-qty, .adm-in input.adm-price { width: 76px; }
.adm-fixed { width: 76px; padding: 7px 12px; font-weight: 800; text-align: right; }
.adm-por { color: var(--muted); font-size: 13px; }
.adm-btn { border: 0; border-radius: 10px; cursor: pointer; font-family: var(--display); font-weight: 700; }
.adm-btn { display: inline-flex; align-items: center; padding: 10px 18px; background: var(--gold); color: #3a2410; font-size: 15px; text-decoration: none; }
.adm-btn.ghost { background: rgba(255,247,238,.1); color: var(--paper); }
.adm-btn:disabled { opacity: .5; cursor: default; }
.adm-log { margin-top: 14px; }
.adm-log ul { list-style: none; margin: 0; padding: 0 0 8px; }
.adm-log li { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.adm-log li span { color: var(--muted); }
.adm-log li time { margin-left: auto; color: var(--muted); font-size: 12px; }
.adm-empty { color: var(--muted); }
.adm-bar { position: fixed; left: 50%; bottom: 16px; transform: translate(-50%, 140%); display: flex; align-items: center; gap: 10px; width: min(560px, calc(100vw - 24px)); padding: 10px 10px 10px 18px; border-radius: 18px; background: #2c2240; box-shadow: 0 12px 34px rgba(0,0,0,.45); transition: transform .2s ease; }
.adm-bar.on { transform: translate(-50%, 0); }
.adm-bar span { flex: 1; font-size: 14px; }
.adm-toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); max-width: calc(100vw - 24px); padding: 10px 16px; border-radius: 14px; background: #2f6b4f; color: #eafff4; font-size: 14px; box-shadow: 0 10px 28px rgba(0,0,0,.4); }
.adm-toast.bad { background: #7a2e3a; color: #fff0f2; }
@media (max-width: 560px) {
  .adm-groups { grid-template-columns: 1fr; }
  .adm-head { flex-direction: column; }
  .adm-row { flex-direction: column; align-items: stretch; gap: 6px; }
  .adm-in input, .adm-in input[type=text] { flex: 1; width: auto; }
}
.adm-eco { margin-bottom: 18px; padding-bottom: 14px; }
.adm-eco .adm-hint b { color: var(--paper); }
.eco-scroll { overflow-x: auto; }
.eco-days, .eco-reasons { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.eco-days th, .eco-reasons th { text-align: left; color: var(--muted); font-size: 12px; font-weight: 800; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.eco-days td, .eco-reasons td { padding: 6px 8px; border-top: 1px solid var(--line); white-space: nowrap; }
.eco-days td.n, .eco-reasons td.n, .eco-days th:nth-child(n+2):not(.eco-legend), .eco-reasons th:nth-child(n+2) { text-align: right; }
.eco-bars { width: 34%; min-width: 140px; }
.eco-bars i { display: block; height: 5px; border-radius: 99px; margin: 2px 0; }
.eco-bars .in, .eco-legend .in { background: #84e2b6; }
.eco-bars .buy, .eco-legend .buy { background: var(--gold); }
.eco-bars .out, .eco-legend .out { background: var(--rose); }
.eco-legend { display: flex; gap: 8px; }
.eco-legend span { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 0 6px; border-radius: 99px; color: #1f1830; }
.eco-sub { margin: 14px 0 4px; font-family: var(--display); font-size: 15px; }

.adm-find { display: flex; gap: 8px; margin: 4px 0 12px; }
.adm-find input { flex: 1; min-width: 0; }
.adm-player { display: flex; flex-direction: column; gap: 10px; }
.adm-pl-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.adm-pl-head b { font-size: 18px; letter-spacing: .06em; }
.adm-pl-state { margin-left: auto; font-weight: 700; }
.adm-pl-state.bad { color: #ff8f80; }
.adm-pl-reasons, .adm-pl-log { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0; padding: 0; list-style: none; font-size: 13px; }
.adm-pl-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.adm-pl-actions label { display: flex; align-items: center; gap: 8px; }
.adm-btn.danger { background: #c9473b; }
.adm-players input, .adm-players select { background: #2f2541; color: inherit; border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 10px; padding: 8px 10px; font: inherit; }
.adm-players input:focus, .adm-players select:focus { outline: 2px solid rgba(255, 200, 90, 0.55); outline-offset: 1px; }
.adm-rep-list { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 0; padding: 0; list-style: none; }
.adm-rep { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.04); }
.adm-rep > div:first-child { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.adm-rep b { word-break: break-word; }
.adm-rep span { font-size: 13px; opacity: 0.8; }
.adm-rep-actions { display: flex; gap: 8px; }
.adm-linkbtn { border: 0; background: none; color: inherit; text-decoration: underline; cursor: pointer; font: inherit; padding: 0; }

</style>
</head>
